name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Crea una release con questo tag (es. v1.1.0); vuoto = solo build"
        required: false
        default: ""
      notes_only:
        description: "Solo note: aggiorna la descrizione di una release esistente da CHANGELOG.md, senza ricompilare"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  windows:
    if: ${{ !inputs.notes_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build executables
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SwitchToolkit --icon assets/switchtk.png --add-data "assets/switchtk.png;assets" --collect-submodules zstandard --collect-submodules crc32c --exclude-module tkinter switchtk_gui.py
          pyinstaller --noconfirm --onefile --console --name switchtk-cli --icon assets/switchtk.png --collect-submodules zstandard --collect-submodules crc32c --exclude-module PySide6 --exclude-module qfluentwidgets --exclude-module tkinter switchtk_cli.py

      - name: Smoke test
        # --version also loads zstd and crc32c: "zstd -" or "crc32c Python" means the exe
        # lacks the C modules NUP and NX need.
        shell: pwsh
        run: |
          $v = dist\switchtk-cli.exe --version
          $v
          if ($v -match 'zstd -' -or $v -notmatch 'crc32c C') { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: SwitchToolkit-windows
          path: |
            dist/SwitchToolkit.exe
            dist/switchtk-cli.exe

  release:
    # On a pushed v* tag, or from "Run workflow" with a release_tag (the tag is
    # then created on the commit that was built).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && !inputs.notes_only)
    needs: [windows]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the program version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' switchtk/__init__.py)
          echo "tag=$TAG version=$version"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Il tag $TAG non corrisponde alla versione $version in switchtk/__init__.py"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: SwitchToolkit-windows
          path: artifacts

      - name: Prepare release files
        # Stable names: the in-app updater looks for SwitchToolkit-windows-x64.exe.
        run: |
          mkdir release
          ls -laR artifacts
          cp artifacts/SwitchToolkit.exe release/SwitchToolkit-windows-x64.exe
          cp artifacts/switchtk-cli.exe release/switchtk-cli-windows-x64.exe
          ls -la release

      - name: Release notes from CHANGELOG.md
        run: |
          # The "## <tag>" section, up to the next "## " heading.
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Manca la sezione '## $TAG' in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Switch Toolkit ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true

  release-notes:
    # "Run workflow" with notes_only: replace the description of an existing
    # release with its CHANGELOG.md section; builds and assets are untouched.
    if: github.event_name == 'workflow_dispatch' && inputs.notes_only && inputs.release_tag != ''
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Update release notes
        run: |
          awk -v tag="## $TAG" '$0 == tag {on=1; next} /^## / {on=0} on' CHANGELOG.md \
            | sed -e '/./,$!d' > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::Manca la sezione '## $TAG' in CHANGELOG.md"
            exit 1
          fi
          cat release-notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
